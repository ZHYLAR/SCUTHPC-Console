[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmbox"
version = "0.1.0"
description = "A persistent Slurm allocation sandbox"
requires-python = ">=3.11"

[project.scripts]
slurmbox = "slurmbox.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

